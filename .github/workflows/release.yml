name: Compile LaTeX and Create Release

on:
  push:
    branches: [ main, master ]
    paths:
      - '**.tex'
      - '**/cv/**'
      - '**/resume/**'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: Elie-BRUNO-ATS.tex

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Generate version tag
        id: version
        run: |
          # Get the latest tag, if any
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Latest tag: $LATEST_TAG"

          # Get the latest commit message
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Commit message: $COMMIT_MSG"

          # Extract current version numbers
          CURRENT_VERSION=$(echo $LATEST_TAG | sed 's/v//')
          MAJOR=$(echo $CURRENT_VERSION | cut -d. -f1)
          MINOR=$(echo $CURRENT_VERSION | cut -d. -f2)
          PATCH=$(echo $CURRENT_VERSION | cut -d. -f3)

          # Check for version bump indicators (text-based gitmoji)
          if echo "$COMMIT_MSG" | grep -E "(:boom:|:fire:|BREAKING)" > /dev/null; then
            # Major version bump
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
            BUMP_TYPE="major"
          elif echo "$COMMIT_MSG" | grep -E "(:sparkles:|:star:|feat:|feature)" > /dev/null; then
            # Minor version bump
            MINOR=$((MINOR + 1))
            PATCH=0
            BUMP_TYPE="minor"
          elif echo "$COMMIT_MSG" | grep -E "(:bug:|:wrench:|fix:|:pencil:|docs)" > /dev/null; then
            # Patch version bump
            PATCH=$((PATCH + 1))
            BUMP_TYPE="patch"
          else
            # Default to patch for any other changes
            PATCH=$((PATCH + 1))
            BUMP_TYPE="patch"
          fi

          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "Bump type: $BUMP_TYPE"
          echo "New tag: $NEW_TAG"
          echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT

      - name: Create Release with PDF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ steps.version.outputs.tag }} \
            ./Elie-BRUNO-ATS.pdf \
            --title "CV Release ${{ steps.version.outputs.tag }} - ${{ steps.date.outputs.date }}" \
            --notes "## CV Update - ${{ steps.date.outputs.date }}

          This release contains the latest version of the CV/Resume.

          ### Changes
          - CV updated on ${{ steps.date.outputs.date }}

          ### Files
          - Elie-BRUNO-Resume-${{ steps.version.outputs.tag }}.pdf"
